[package]
name = "thinkwatch-lite"
version = "2026.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "面向个人开发者的本地 AI 网关"

[lib]
name = "thinkwatch_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"

# 控制面契约来自 core。UI 和 CLI 依赖同一份类型，不会各写一遍。
tw-api = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", branch = "main" }

anyhow = "1"
libc = "0.2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# core 那边同样保留 unwind，理由一致：catch_unwind 要靠它兜住单个请求的
# panic，而 abort 会让那层防护失效。
panic = "unwind"
