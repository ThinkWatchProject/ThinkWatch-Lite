[package]
name = "thinkwatch-lite"
version = "2026.9.13"
edition = "2024"
# **这个数决定依赖能升到哪一版。**edition 2024 的解析器只挑声明的 Rust
# 版本编得动的依赖：写 1.85 的时候，`cargo update` 一直停在旧的 time 和
# serde_with 上，两处安全修复（都要 1.88）就这样进不来。CI 和发布用的是
# stable，把它往回调不会让谁编译得更顺，只会把修复挡在外面。
rust-version = "1.88"
license = "MIT"
description = "Desktop app for a local AI gateway, built for individual developers"

[lib]
name = "thinkwatch_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
# 在默认浏览器里打开授权页
tauri-plugin-opener = "2"
# 浏览器里授权完成之后，那一页把应用带回前台（`thinkwatch://`）
tauri-plugin-deep-link = "2"

# 控制面契约来自 core。UI 和 CLI 依赖同一份类型，不会各写一遍。
# **钉在 tag 上，不是分支。**跟着 `main` 走意味着同一份源码今天和明天
# 编出来的东西不一样；而更要紧的是，打进 `.app` 的那个 twcore 二进制
# 必须和这里编译进去的协议镜像来自同一个 core 版本 —— 打包脚本正是从
# 这个 tag 去取二进制的（见 scripts/fetch-core.sh）。
tw-api = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.40.0" }

anyhow = "1"
# 生成控制面的凭据（见 src/token.rs）
rand = "0.10"
libc = "0.2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2"
# Homebrew 那一档要去读 tap 里的 cask。**和更新器插件同一套 HTTP 与 TLS**
# —— 版本、特性都对齐它，所以这里不多编译任何东西；系统代理也跟着一起认。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# Homebrew 那一档的「复制命令」。**在 Rust 这边写剪贴板**，理由见
# `update_copy_command`。
tauri-plugin-clipboard-manager = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# core 那边同样保留 unwind，理由一致：catch_unwind 要靠它兜住单个请求的
# panic，而 abort 会让那层防护失效。
panic = "unwind"

# 开发和测试构建只留行号表：报错和 panic 仍能指到文件和行，变量级调试信息不要。
# 每个集成测试都是链接整个 crate 的独立二进制，带完整调试信息时 target/ 会涨到上百 GB。
[profile.dev]
debug = "line-tables-only"

# 系统通知走 UNUserNotificationCenter：能原地更新、撤回、点开落到对应页面（见
# `notices/macos.rs`）。版本跟着 Tauri 自己用的那一套
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
# 菜单栏自己持有 NSStatusItem 和 NSMenu（见 `menubar/macos.rs`）。和 Tauri 用的是同一版
objc2-app-kit = "0.3"
# 菜单开着时主线程在事件跟踪模式，更新要走 GCD 的主队列才执行得到
dispatch2 = "0.3"
# 更新包是 DMG，而更新器插件只装 `.app.tar.gz`：挂上映像，把里面的 `.app`
# 打成那样一个包（见 `dmg.rs`）。三个都是插件自己在用的，版本跟着它
tar = "0.4"
flate2 = "1"
tempfile = "3.20"

# **只有这两个平台需要单实例。**macOS 由系统保证一个 bundle 只跑一份
# （`RunEvent::Reopen` 就是这么来的）；别处没有这个保证，理由见 lib.rs 里
# 注册它的地方。
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# 强杀 core 那一步：Windows 上没有 SIGKILL，用 TerminateProcess
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # 跟随系统的深浅色：读注册表里那一项
    "Win32_System_Registry",
    # 跟随系统的语言
    "Win32_Globalization",
    # 起 core 前现读用户配的环境变量（`supervisor::user_env`）
    "Win32_System_Environment",
] }
# 系统通知走 WinRT 的 toast：能原地更新、撤回、点开落到对应页面（见
# `notices/windows/`）。版本跟着 Tauri 在 Windows 上已经拉进来的那一份，不多编一套
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[dev-dependencies]
# 去抖和限流要按时间测。**暂停时钟**，不是真的等一分钟
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
