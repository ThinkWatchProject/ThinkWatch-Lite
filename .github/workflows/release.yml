# 发一版桌面端。
#
# **只发一个文件。**`ThinkWatch-Lite-<版本>-arm64.dmg`，外加它的 sha256
# 和 latest.json —— 网页上下载的是它，Homebrew 的 cask 吃的是它，已经
# 装上的应用自己更新下的也是它：latest.json 指向它，签名签的也是它
# （应用怎么从 DMG 更新自己，见 `src-tauri/src/dmg.rs`）。
#
# 这条流水线不重跑 `ci.yml` 那几道门：tag 是从 main 上打的，main 上
# 每个 commit 都过过。这里只做 CI 做不了的那件事 —— 打出 `.app` 并且
# 在发出去之前拆开看一眼。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 签 `.app` 用的证书。**自签名，不是 Developer ID** —— Gatekeeper 照样
  # 不认它，第一次打开照样要去掉隔离属性。
  #
  # 它存在只为一件事：**让每一版的签名者是同一个。**临时签名（`-`）的
  # 「指定要求」是那一次构建的 cdhash，每一版都不一样，于是 Homebrew 每次
  # 升级都判「signer changed」并打一条 macOS 可能会拦的警告。钉在一张证书
  # 上之后，指定要求变成「这张证书签的 app.thinkwatch.lite」，升级前后是
  # 同一个签名者，警告就没了。
  #
  # 指纹写死在这里，发布前核对 —— 证书被换掉或者 secret 丢了、构建悄悄
  # 退回临时签名的话，每个用户下一次升级都会再看到那条警告，而流水线不会
  # 有任何报错。
  SIGNING_IDENTITY: "ThinkWatchProject (self-signed)"
  SIGNING_CERT_SHA1: 7a0b45ea2d84acc6fb99cbf00d02e5954171e150

jobs:
  app:
    name: ThinkWatch Lite (aarch64-apple-darwin)
    # 只发 Apple Silicon。**不是「暂时」** —— 覆盖不到的那部分机器
    # 拿到的是一个能下载但打不开的文件，那比没有更糟。
    runs-on: macos-latest
    # 发完把 cask 推给 tap 用的那把密钥（只对 homebrew-tap 一个仓库有推送权）。
    # **写在 job 上，不写在步骤上** —— 步骤自己的 `env` 读不到它自己的 `if`，
    # 而那一步要在没配密钥时整步跳过
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      # 先对版本号。**放在构建前面**，因为它是这条流水线里唯一一个
      # 「发现了也没法在本次补救」的问题 —— tag 一旦推上去就得撤回。
      # 二十秒发现，好过二十分钟之后。
      - name: The tag is the version in the tree
        run: |
          set -euo pipefail
          GOT=$(bash scripts/version.sh)
          WANT="${GITHUB_REF_NAME#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "tag 是 $WANT，而代码里写的是 $GOT" >&2
            exit 1
          fi
          echo "VERSION=$GOT" >> "$GITHUB_ENV"

      # tag 上那段话就是应用里显示的发布说明 —— 自动生成的提交清单在
      # 那个位置对用户没有意义。
      #
      # **不从工作区的 git 里读。**`actions/checkout` 取 tag 时建的是一个
      # 直接指向 commit 的轻量引用，注解对象根本不在这个克隆里；
      # `%(contents:body)` 于是回答那个 commit 的正文，而 squash 合并的
      # commit 正文是它的 trailer —— 2026.9.1 第一次就是这么把一行
      # `Co-authored-by` 当作发布说明发出去的。这里问的是仓库本身。
      - name: The notes are the tag's own message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > notes.txt
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
          # 轻量 tag 指向的是 commit，没有正文可取 —— 那就不写发布说明。
          if [ "$(gh api "$REF" --jq .object.type)" = tag ]; then
            SHA=$(gh api "$REF" --jq .object.sha)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message \
              | awk 'BEGIN { body = 0 } body { print } /^$/ { body = 1 }' > notes.txt
          fi
          cat notes.txt

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 证书进一个临时钥匙串，挂进搜索列表，codesign 才找得到它。
      #
      # **不走 Tauri 自带的 `APPLE_CERTIFICATE`。**那条路只认名字形如
      # 「Developer ID Application: …」、带团队编号的 Apple 证书，自签名的
      # 证书在那里找不到签名身份 —— 而为了让它认，把证书名字起成 Apple
      # 那种格式是冒名，不做。
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KC" -P "$PASSWORD" -T /usr/bin/codesign
          # 不设这一条的话，codesign 第一次用私钥时会弹授权框 —— 在
          # runner 上没有人去点，构建就挂在那里
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -p codesigning "$KC" | grep -q "$SIGNING_IDENTITY"

      # `--target` 写出来，产物路径才是定死的。不写的话它跟着 runner
      # 的架构走，哪天 runner 换了，后面每一行路径都得跟着猜。
      # 编译前 `beforeBuildCommand` 会把 twcore 取回来并核对校验和。
      - name: Build
        env:
          # 覆盖 tauri.conf.json 里的 `-`。配置里留着临时签名，是为了没有这张
          # 证书的机器上本地构建照样能打出一个能跑的包
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
        run: pnpm tauri build --target aarch64-apple-darwin

      # **拆开看一眼再发。**一个缺了网关的 .app 从文件大小上看不出
      # 任何问题 —— 它照样启动，照样出界面，然后停在连接页上。那个 bug
      # 之前真的被造出来过。
      - name: Look inside before shipping it
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ThinkWatch Lite.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/thinkwatch-lite" | grep -q arm64
          # 验这个 `.app` 是一个**结构完整**的包。封不上的包，macOS 报的是
          # 「已损坏」—— 和「开发者身份未知」是两码事，后者用户能绕过去，
          # 前者不能。
          codesign --verify --deep --strict "$APP"
          # 签名者是那一张证书。**临时签名也能通过上面那一行**，所以要单独
          # 核对：退回临时签名的包照样能装能跑，只是每个 Homebrew 用户下一次
          # 升级都会看到「signer changed」。
          REQ=$(codesign -d -r- "$APP" 2>&1)
          echo "$REQ" | grep -q "certificate root = H\"$SIGNING_CERT_SHA1\"" || {
            echo "签名证书不对：$REQ" >&2
            exit 1
          }
          CORE="$APP/Contents/Resources/twcore"
          test -x "$CORE"
          file "$CORE" | grep -q arm64
          echo "包里的网关：$("$CORE" --version)"
          PLIST=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          if [ "$PLIST" != "$VERSION" ]; then
            echo "Info.plist 里是 $PLIST，而 tag 是 $VERSION" >&2
            exit 1
          fi

      # 磁盘映像用 dmgbuild 打，版面在 `src-tauri/dmg/`（背景图、图标位置、
      # 窗口大小）。**不让 Tauri 打**：Tauri 摆图标靠驱动 Finder 的
      # AppleScript，在 CI 上会自己跳过，发出去的就是 Finder 的默认窗口。
      # dmgbuild 直接写 Finder 读的那份 .DS_Store，不需要图形界面。
      #
      # 装在一个虚拟环境里，按哈希装 —— 见 requirements.txt。
      - name: Build the disk image
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes --no-deps \
            --only-binary :all: -r src-tauri/dmg/requirements.txt
          mkdir -p dist
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s src-tauri/dmg/settings.py \
            -D app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ThinkWatch Lite.app" \
            -D dir=src-tauri/dmg -D icon=src-tauri/icons/icon.icns \
            "ThinkWatch Lite" "dist/ThinkWatch-Lite-$VERSION-arm64.dmg"

      # 签的是 DMG 本身：应用自己更新时下的就是它，验签验的是下载下来的
      # 原始字节。**私钥没传进来这一步就失败** —— 那正是要让它失败的地方，
      # 否则发出去的是一个没有签名、每台机器都会拒绝的更新。
      - name: Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/ThinkWatch-Lite-$VERSION-arm64.dmg"
          ( cd dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256" )
          cat "$DMG.sha256"

          pnpm tauri signer sign "$DMG"
          python3 scripts/manifest.py "$VERSION" "$DMG" notes.txt

      # 挂上去再验一次。**打包这一步本身就可能是那个出错的环节** ——
      # 而它出错的样子恰恰是「下得下来、打开之后里面的应用起不来」。验的
      # 是用户会拿到的那个映像，不是构建目录里的那份 `.app`。
      - name: The disk image holds a working app
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" \
            "dist/ThinkWatch-Lite-$VERSION-arm64.dmg"
          APP="$MNT/ThinkWatch Lite.app"
          codesign --verify --deep --strict "$APP"
          test -x "$APP/Contents/MacOS/thinkwatch-lite"
          test -x "$APP/Contents/Resources/twcore"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$VERSION"
          # 拖放的目标。少了它，打开映像的人看到的只有一个应用图标，
          # 不知道该把它放到哪里去。
          test "$(readlink "$MNT/Applications")" = /Applications
          # 版面在不在。少了其中任何一个，窗口就退回 Finder 的默认样子 ——
          # 映像照样能用，所以不查就不会有人发现
          test -s "$MNT/.DS_Store"
          test -s "$MNT/.background.tiff"
          # 从映像里拷出来的那一份，签名者也还是那张证书
          codesign -d -r- "$APP" 2>&1 | grep -q "certificate root = H\"$SIGNING_CERT_SHA1\""
          hdiutil detach "$MNT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ThinkWatch-Lite-*-arm64.dmg
            dist/ThinkWatch-Lite-*-arm64.dmg.sha256
            dist/latest.json
          generate_release_notes: true

      # Homebrew 装的应用读的是 tap 里的 cask：**cask 没跟上之前，
      # `brew upgrade` 什么也装不到**，那部分用户就一直停在上一版。所以发布
      # 一完成就把 cask 推过去，而不是等 tap 每小时那一轮。
      #
      # 改 cask 的仍然是 tap 自己的脚本（`scripts/bump.sh`）：它照着刚发出去的
      # release 取文件、亲手算校验值，和定时跑的是同一段代码。
      #
      # **推不动也不让发版失败**：密钥没配、被撤销、tap 一时连不上，最多是晚
      # 一个小时 —— 那边的定时还在。
      - name: The tap follows this release
        if: env.TAP_DEPLOY_KEY != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/tap_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$TAP_DEPLOY_KEY" >"$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:ThinkWatchProject/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          bash scripts/bump.sh
          if git diff --quiet; then
            echo "cask 已经指着这一版了。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "thinkwatch-lite $VERSION"
          git push
