# 发一版桌面端。
#
# **每一种安装方式只发一个文件**，外加它的 sha256，和一份所有平台共用的
# latest.json：
#
#   macOS           ThinkWatch-Lite-<版本>-arm64.dmg
#   Windows x64     ThinkWatch-Lite-<版本>-x64-setup.exe
#   Windows arm64   ThinkWatch-Lite-<版本>-arm64-setup.exe
#   Linux x86_64    ThinkWatch-Lite-<版本>-x86_64.AppImage、thinkwatch-lite_<版本>_amd64.deb
#   Linux aarch64   ThinkWatch-Lite-<版本>-aarch64.AppImage、thinkwatch-lite_<版本>_arm64.deb
#
# 网页上下载的是它，Homebrew 的 cask / winget 的清单吃的是它，已经装上的
# 应用自己更新下的也是它：latest.json 指向它，签名签的也是它（应用怎么从
# DMG 更新自己，见 `src-tauri/src/dmg.rs`；Windows 上更新器直接跑新的安装
# 程序；Linux 上 AppImage 原地换掉自己，deb 经系统授权交给 apt）。
#
# **所有平台一起发，或者都不发。**各自构建、拆开看过，最后一个 job 才把
# 它们一起挂上去 —— 只发出一部分的话，latest.json 要么缺平台，要么指向
# 一个不存在的文件。
#
# 这条流水线不重跑 `ci.yml` 那几道门：tag 是从 main 上打的，main 上
# 每个 commit 都过过。这里只做 CI 做不了的那件事 —— 打出安装包并且
# 在发出去之前拆开看一眼。
#
# **推到 `rehearse/` 开头的分支是演练**：全部照做，只是不发布 —— 各个安装
# 包留在这次运行的产物里，可以下载下来装到真机上看。改了这条流水线，先演练
# 一遍，不要拿一个 tag 去试。
#
# 不用手工触发（`workflow_dispatch`）：那只认默认分支上的这份文件，而改动
# 要先进 dev、过很久才到 main —— 等于改完的流水线没法在合并之前演练。
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["rehearse/**"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 签 `.app` 用的证书。**自签名，不是 Developer ID** —— Gatekeeper 照样
  # 不认它，第一次打开照样要去掉隔离属性。
  #
  # 它存在只为一件事：**让每一版的签名者是同一个。**临时签名（`-`）的
  # 「指定要求」是那一次构建的 cdhash，每一版都不一样，于是 Homebrew 每次
  # 升级都判「signer changed」并打一条 macOS 可能会拦的警告。钉在一张证书
  # 上之后，指定要求变成「这张证书签的 app.thinkwatch.lite」，升级前后是
  # 同一个签名者，警告就没了。
  #
  # 指纹写死在这里，发布前核对 —— 证书被换掉或者 secret 丢了、构建悄悄
  # 退回临时签名的话，每个用户下一次升级都会再看到那条警告，而流水线不会
  # 有任何报错。
  SIGNING_IDENTITY: "ThinkWatchProject (self-signed)"
  SIGNING_CERT_SHA1: 7a0b45ea2d84acc6fb99cbf00d02e5954171e150

jobs:
  app:
    name: ThinkWatch Lite (aarch64-apple-darwin)
    # 只发 Apple Silicon。**不是「暂时」** —— 覆盖不到的那部分机器
    # 拿到的是一个能下载但打不开的文件，那比没有更糟。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 先对版本号。**放在构建前面**，因为它是这条流水线里唯一一个
      # 「发现了也没法在本次补救」的问题 —— tag 一旦推上去就得撤回。
      # 二十秒发现，好过二十分钟之后。
      - name: The tag is the version in the tree
        run: |
          set -euo pipefail
          GOT=$(bash scripts/version.sh)
          # 演练没有 tag，拿代码里的版本号照做一遍
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            WANT="${GITHUB_REF_NAME#v}"
            if [ "$GOT" != "$WANT" ]; then
              echo "tag 是 $WANT，而代码里写的是 $GOT" >&2
              exit 1
            fi
          fi
          echo "VERSION=$GOT" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 证书进一个临时钥匙串，挂进搜索列表，codesign 才找得到它。
      #
      # **不走 Tauri 自带的 `APPLE_CERTIFICATE`。**那条路只认名字形如
      # 「Developer ID Application: …」、带团队编号的 Apple 证书，自签名的
      # 证书在那里找不到签名身份 —— 而为了让它认，把证书名字起成 Apple
      # 那种格式是冒名，不做。
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KC" -P "$PASSWORD" -T /usr/bin/codesign
          # 不设这一条的话，codesign 第一次用私钥时会弹授权框 —— 在
          # runner 上没有人去点，构建就挂在那里
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -p codesigning "$KC" | grep -q "$SIGNING_IDENTITY"

      # `--target` 写出来，产物路径才是定死的。不写的话它跟着 runner
      # 的架构走，哪天 runner 换了，后面每一行路径都得跟着猜。
      # 编译前 `beforeBuildCommand` 会把 twcore 取回来并核对校验和。
      - name: Build
        env:
          # 覆盖 tauri.conf.json 里的 `-`。配置里留着临时签名，是为了没有这张
          # 证书的机器上本地构建照样能打出一个能跑的包
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
        run: pnpm tauri build --target aarch64-apple-darwin

      # **拆开看一眼再发。**一个缺了网关的 .app 从文件大小上看不出
      # 任何问题 —— 它照样启动，照样出界面，然后停在连接页上。那个 bug
      # 之前真的被造出来过。
      - name: Look inside before shipping it
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ThinkWatch Lite.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/thinkwatch-lite" | grep -q arm64
          # 验这个 `.app` 是一个**结构完整**的包。封不上的包，macOS 报的是
          # 「已损坏」—— 和「开发者身份未知」是两码事，后者用户能绕过去，
          # 前者不能。
          codesign --verify --deep --strict "$APP"
          # 签名者是那一张证书。**临时签名也能通过上面那一行**，所以要单独
          # 核对：退回临时签名的包照样能装能跑，只是每个 Homebrew 用户下一次
          # 升级都会看到「signer changed」。
          REQ=$(codesign -d -r- "$APP" 2>&1)
          echo "$REQ" | grep -q "certificate root = H\"$SIGNING_CERT_SHA1\"" || {
            echo "签名证书不对：$REQ" >&2
            exit 1
          }
          CORE="$APP/Contents/Resources/twcore"
          test -x "$CORE"
          file "$CORE" | grep -q arm64
          echo "包里的网关：$("$CORE" --version)"
          PLIST=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          if [ "$PLIST" != "$VERSION" ]; then
            echo "Info.plist 里是 $PLIST，而 tag 是 $VERSION" >&2
            exit 1
          fi

      # 磁盘映像用 dmgbuild 打，版面在 `src-tauri/dmg/`（背景图、图标位置、
      # 窗口大小）。**不让 Tauri 打**：Tauri 摆图标靠驱动 Finder 的
      # AppleScript，在 CI 上会自己跳过，发出去的就是 Finder 的默认窗口。
      # dmgbuild 直接写 Finder 读的那份 .DS_Store，不需要图形界面。
      #
      # 装在一个虚拟环境里，按哈希装 —— 见 requirements.txt。
      - name: Build the disk image
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes --no-deps \
            --only-binary :all: -r src-tauri/dmg/requirements.txt
          mkdir -p dist
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s src-tauri/dmg/settings.py \
            -D app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ThinkWatch Lite.app" \
            -D dir=src-tauri/dmg -D icon=src-tauri/icons/icon.icns \
            "ThinkWatch Lite" "dist/ThinkWatch-Lite-$VERSION-arm64.dmg"

      # 签的是 DMG 本身：应用自己更新时下的就是它，验签验的是下载下来的
      # 原始字节。**私钥没传进来这一步就失败** —— 那正是要让它失败的地方，
      # 否则发出去的是一个没有签名、每台机器都会拒绝的更新。
      - name: Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/ThinkWatch-Lite-$VERSION-arm64.dmg"
          ( cd dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256" )
          cat "$DMG.sha256"

          pnpm tauri signer sign "$DMG"

      # 挂上去再验一次。**打包这一步本身就可能是那个出错的环节** ——
      # 而它出错的样子恰恰是「下得下来、打开之后里面的应用起不来」。验的
      # 是用户会拿到的那个映像，不是构建目录里的那份 `.app`。
      - name: The disk image holds a working app
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" \
            "dist/ThinkWatch-Lite-$VERSION-arm64.dmg"
          APP="$MNT/ThinkWatch Lite.app"
          codesign --verify --deep --strict "$APP"
          test -x "$APP/Contents/MacOS/thinkwatch-lite"
          test -x "$APP/Contents/Resources/twcore"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$VERSION"
          # 拖放的目标。少了它，打开映像的人看到的只有一个应用图标，
          # 不知道该把它放到哪里去。
          test "$(readlink "$MNT/Applications")" = /Applications
          # 版面在不在。少了其中任何一个，窗口就退回 Finder 的默认样子 ——
          # 映像照样能用，所以不查就不会有人发现
          test -s "$MNT/.DS_Store"
          test -s "$MNT/.background.tiff"
          # 从映像里拷出来的那一份，签名者也还是那张证书
          codesign -d -r- "$APP" 2>&1 | grep -q "certificate root = H\"$SIGNING_CERT_SHA1\""
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/ThinkWatch-Lite-*-arm64.dmg
            dist/ThinkWatch-Lite-*-arm64.dmg.sha256
            dist/ThinkWatch-Lite-*-arm64.dmg.sig
          if-no-files-found: error

  windows:
    name: ThinkWatch Lite (${{ matrix.target }})
    strategy:
      # 一个架构挂了不取消另一个：演练的时候两边的问题想一次看全
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            runner: windows-latest
          # **在 arm64 的机器上打 arm64 的包，不交叉编译。**交叉编出来的包
          # 在 x64 的机器上跑不起来，下面「拆开看一眼」里运行网关那一行就
          # 只能跳过 —— 而那一行正是要挡住「装了一个跑不了的网关」的。
          - target: aarch64-pc-windows-msvc
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # 取版本号、取 twcore 的两个脚本要 Python。Windows 的机器上不一定有，
      # 有也不一定叫 `python3` —— 脚本两个名字都认，这里保证至少有一个
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: The tag is the version in the tree
        run: |
          set -euo pipefail
          GOT=$(bash scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            WANT="${GITHUB_REF_NAME#v}"
            if [ "$GOT" != "$WANT" ]; then
              echo "tag 是 $WANT，而代码里写的是 $GOT" >&2
              exit 1
            fi
          fi
          echo "VERSION=$GOT" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # `--target` 写出来，产物路径才是定死的。取哪一份 twcore 也跟着它走：
      # Tauri 把它交给 `beforeBuildCommand`，见 `fetch-core.sh`。
      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }}

      # **拆开看一眼再发。**和 macOS 那边同一个理由：一个缺了网关、或者
      # 网关是别的架构的包，从文件大小上看不出任何问题。
      #
      # 这里看的是**安装程序本身**，不是构建目录 —— 用 7-Zip 把它打开，
      # 要装进去的每一样东西都在里面。
      - name: Look inside before shipping it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          $built = @(Get-ChildItem "$bundle\*-setup.exe")
          if ($built.Count -ne 1) { throw "要的是一个安装程序，打出来的是 $($built.Count) 个" }

          # 发出去的名字**不带空格**，和 DMG 一个样子。Tauri 按产品名起的
          # 名字里有空格，而 GitHub 会把资源名里的空格换成点，latest.json
          # 里的地址就对不上了
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist\ThinkWatch-Lite-$env:VERSION-${{ matrix.arch }}-setup.exe"
          Copy-Item $built[0].FullName $exe

          $x = "$env:RUNNER_TEMP\inside"
          & 7z x -y "-o$x" $exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip 打不开这个安装程序" }
          $app = Get-ChildItem -Recurse "$x\thinkwatch-lite.exe" | Select-Object -First 1
          $core = Get-ChildItem -Recurse "$x\twcore.exe" | Select-Object -First 1
          if (-not $app) { throw "安装程序里没有 thinkwatch-lite.exe" }
          if (-not $core) { throw "安装程序里没有 twcore.exe" }

          # 版本资源和 tag 对得上。「添加/删除程序」、winget、更新器看的都是它
          $v = $app.VersionInfo.ProductVersion
          if (-not $v.StartsWith($env:VERSION)) { throw "exe 里的版本是 $v，而这一版是 $env:VERSION" }

          # 架构对得上：读 PE 头里的 machine 字段，比看文件名准
          $want = @{ "x64" = 0x8664; "arm64" = 0xAA64 }["${{ matrix.arch }}"]
          foreach ($f in @($app.FullName, $core.FullName)) {
            $b = [IO.File]::ReadAllBytes($f)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $m = [BitConverter]::ToUInt16($b, $pe + 4)
            if ($m -ne $want) { throw ("{0} 的架构是 0x{1:X4}，要的是 0x{2:X4}" -f $f, $m, $want) }
          }
          Write-Host "包里的网关：$(& $core.FullName --version)"
          if ($LASTEXITCODE -ne 0) { throw "包里的网关跑不起来" }

      # 签的是安装程序本身：更新器下载的就是它，验签验的是原始字节。
      # **私钥没传进来这一步就失败** —— 理由和 macOS 那边一样。
      - name: Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXE="dist/ThinkWatch-Lite-$VERSION-${{ matrix.arch }}-setup.exe"
          # Git Bash 带的是 sha256sum，输出和 shasum 是同一种两列格式
          ( cd dist && sha256sum "$(basename "$EXE")" > "$(basename "$EXE").sha256" )
          cat "$EXE.sha256"
          pnpm tauri signer sign "$EXE"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/ThinkWatch-Lite-*-setup.exe
            dist/ThinkWatch-Lite-*-setup.exe.sha256
            dist/ThinkWatch-Lite-*-setup.exe.sig
          if-no-files-found: error

  linux:
    name: ThinkWatch Lite (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # **在 22.04 上构建**：glibc 2.35 是 Linux 版的最低要求，在更新的系统
          # 上构建出来的二进制会去要更新的 glibc，在 22.04 上起不来
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            deb: amd64
            runner: ubuntu-22.04
          # 和 Windows 一样在同架构的机器上打，「拆开看一眼」里运行网关那一行才
          # 不用跳过
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            deb: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # linuxdeploy 自己是个 AppImage，runner 上不一定能挂 FUSE。解开再跑，
      # 不依赖它
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the version in the tree
        run: |
          set -euo pipefail
          GOT=$(bash scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            WANT="${GITHUB_REF_NAME#v}"
            if [ "$GOT" != "$WANT" ]; then
              echo "tag 是 $WANT，而代码里写的是 $GOT" >&2
              exit 1
            fi
          fi
          echo "VERSION=$GOT" >> "$GITHUB_ENV"

      # Tauri 在 Linux 上的构建依赖（https://v2.tauri.app/start/prerequisites/）。
      # 托盘走 ayatana 那一套：打包器看到它才会把 `libayatana-appindicator3-1`
      # 写进 deb 的依赖、把那个库放进 AppImage。`xdg-utils`：配了深链接的
      # 应用，打 AppImage 时要把 `/usr/bin/xdg-mime` 拷进包里（运行时靠它注册
      # `thinkwatch://`），没有它打包直接失败
      - name: System libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            xdg-utils desktop-file-utils

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 打哪两种包写在 `tauri.linux.conf.json` 里。取哪一份 twcore 跟着
      # `--target` 走，见 `fetch-core.sh`
      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }}

      # 发出去的名字**不带空格**，理由和 Windows 那边一样。deb 按 Debian 的
      # 惯例起名：包名_版本_架构。
      #
      # **包名要改一次。**打包器拿产品名转 kebab-case 当包名，「ThinkWatch
      # Lite」成了 `think-watch-lite`，和可执行文件、cask、winget 里的
      # `thinkwatch-lite` 对不上，也没有配置项能改。这里拆开改掉 control 里
      # 那一行再封回去；文件本身一个字节不动，md5sums 仍然对得上。**要在签名
      # 之前**：签的是发出去的这一份
      - name: Name the packages
        run: |
          set -euo pipefail
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          IMAGES=("$B"/appimage/*.AppImage)
          DEBS=("$B"/deb/*.deb)
          [ "${#IMAGES[@]}" -eq 1 ] || { echo "要一个 AppImage，打出来的是 ${#IMAGES[@]} 个" >&2; exit 1; }
          [ "${#DEBS[@]}" -eq 1 ] || { echo "要一个 deb，打出来的是 ${#DEBS[@]} 个" >&2; exit 1; }
          mkdir -p dist
          cp "${IMAGES[0]}" "dist/ThinkWatch-Lite-$VERSION-${{ matrix.arch }}.AppImage"
          R=$(mktemp -d)
          dpkg-deb -R "${DEBS[0]}" "$R/pkg"
          sed -i 's/^Package: .*/Package: thinkwatch-lite/' "$R/pkg/DEBIAN/control"
          dpkg-deb --root-owner-group -Zxz -b "$R/pkg" "dist/thinkwatch-lite_${VERSION}_${{ matrix.deb }}.deb"
          echo "APPIMAGE=dist/ThinkWatch-Lite-$VERSION-${{ matrix.arch }}.AppImage" >> "$GITHUB_ENV"
          echo "DEB=dist/thinkwatch-lite_${VERSION}_${{ matrix.deb }}.deb" >> "$GITHUB_ENV"

      # **拆开看一眼再发。**和另外两个平台同一个理由：缺了网关、网关是别的
      # 架构、或者更新器认不出这是哪种包，从文件列表上都看不出来。
      #
      # 应用靠打包器写进二进制的那个标记区分 AppImage 和 deb（自更新走哪条路、
      # 去哪找网关都看它），所以每个包里的那一份都要带着**自己那种**标记。
      - name: Look inside before shipping it
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)  ELF="ELF 64-bit.*x86-64" ;;
            aarch64) ELF="ELF 64-bit.*aarch64" ;;
          esac
          # 一个包拆开之后的根目录里，应用和网关都在，且都对
          check() {
            local root=$1 marker=$2
            local app="$root/usr/bin/thinkwatch-lite"
            local core="$root/usr/lib/ThinkWatch Lite/twcore"
            test -x "$app" || { echo "没有 $app" >&2; exit 1; }
            test -x "$core" || { echo "没有 $core" >&2; exit 1; }
            file "$app" | grep -Eq "$ELF" || { echo "应用的架构不对：$(file "$app")" >&2; exit 1; }
            file "$core" | grep -Eq "$ELF" || { echo "网关的架构不对：$(file "$core")" >&2; exit 1; }
            # 打包器把 `…_UNK` 那几个字节原地改成这种包的名字（没打补丁的
            # 二进制里只有 `UNK` 这一份，比较用的那几个名字不以字符串的形式出现）
            if grep -aq __TAURI_BUNDLE_TYPE_VAR_UNK "$app"; then
              echo "应用没打上打包标记" >&2; exit 1
            fi
            [ "$(grep -ao "__TAURI_BUNDLE_TYPE_VAR_$marker" "$app" | wc -l)" -eq 1 ] \
              || { echo "应用里的打包标记不是 $marker" >&2; exit 1; }
            # glibc 的底线：比 2.35 新的符号意味着在 22.04 上起不来
            local top
            top=$(objdump -T "$app" "$core" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
            printf '%s\n' "$top" GLIBC_2.35 | sort -V -C \
              || { echo "要的 glibc 是 $top，超过了 2.35" >&2; exit 1; }
            echo "包里的网关：$("$core" --version)"
            # 登录回调靠这两行：认领 `thinkwatch://`，并且 Exec 带 `%u` 把链接交进来
            # （见 `src-tauri/linux/main.desktop`）
            local desktop="$root/usr/share/applications/ThinkWatch Lite.desktop"
            desktop-file-validate "$desktop"
            grep -q '^MimeType=.*x-scheme-handler/thinkwatch;' "$desktop" \
              || { echo ".desktop 里没有 thinkwatch 链接" >&2; exit 1; }
            grep -q '^Exec=thinkwatch-lite %u$' "$desktop" \
              || { echo ".desktop 的 Exec 不带 %u" >&2; exit 1; }
          }

          X=$(mktemp -d)
          ( cd "$X" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract > /dev/null )
          check "$X/squashfs-root" APP

          D=$(mktemp -d)
          dpkg-deb -x "$DEB" "$D"
          check "$D" DEB
          # 不用 `grep -q`：它找到就退出，`dpkg-deb` 还在写就挨一个 SIGPIPE，
          # 在 pipefail 下整步失败
          dpkg-deb -c "$DEB" | grep ' ./usr/lib/ThinkWatch Lite/twcore$' > /dev/null
          test "$(dpkg-deb -f "$DEB" Package)" = thinkwatch-lite
          test "$(dpkg-deb -f "$DEB" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "${{ matrix.deb }}"
          # 依赖由打包器写：WebKitGTK、GTK、托盘。少一个，apt 装完照样打不开
          DEPENDS=$(dpkg-deb -f "$DEB" Depends)
          for dep in libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1; do
            grep -q "$dep" <<< "$DEPENDS" || { echo "deb 的依赖里没有 $dep：$DEPENDS" >&2; exit 1; }
          done

      # 两个都签：AppImage 的用户更新时下的是 AppImage，deb 的用户下的是
      # deb，验签验的都是下载下来的原始字节。**私钥没传进来这一步就失败**
      - name: Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for f in "$APPIMAGE" "$DEB"; do
            ( cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256" )
            cat "$f.sha256"
            pnpm tauri signer sign "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/ThinkWatch-Lite-*.AppImage
            dist/ThinkWatch-Lite-*.AppImage.sha256
            dist/ThinkWatch-Lite-*.AppImage.sig
            dist/thinkwatch-lite_*.deb
            dist/thinkwatch-lite_*.deb.sha256
            dist/thinkwatch-lite_*.deb.sig
          if-no-files-found: error

  publish:
    name: Publish
    needs: [app, windows, linux]
    # 演练到上面为止
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    # 发完把 cask 推给 tap 用的那把密钥（只对 homebrew-tap 一个仓库有推送权）。
    # **写在 job 上，不写在步骤上** —— 步骤自己的 `env` 读不到它自己的 `if`，
    # 而那一步要在没配密钥时整步跳过
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # tag 上那段话就是应用里显示的发布说明 —— 自动生成的提交清单在
      # 那个位置对用户没有意义。
      #
      # **不从工作区的 git 里读。**`actions/checkout` 取 tag 时建的是一个
      # 直接指向 commit 的轻量引用，注解对象根本不在这个克隆里；
      # `%(contents:body)` 于是回答那个 commit 的正文，而 squash 合并的
      # commit 正文是它的 trailer —— 2026.9.1 第一次就是这么把一行
      # `Co-authored-by` 当作发布说明发出去的。这里问的是仓库本身。
      - name: The notes are the tag's own message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > notes.txt
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
          # 轻量 tag 指向的是 commit，没有正文可取 —— 那就不写发布说明。
          if [ "$(gh api "$REF" --jq .object.type)" = tag ]; then
            SHA=$(gh api "$REF" --jq .object.sha)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message \
              | awk 'BEGIN { body = 0 } body { print } /^$/ { body = 1 }' > notes.txt
          fi
          cat notes.txt

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 清单等所有平台都到齐了才写 —— 少一个它就不写，见 manifest.py。
      - name: One manifest for every platform
        run: |
          set -euo pipefail
          python3 scripts/manifest.py "$VERSION" notes.txt \
            "darwin-aarch64=dist/ThinkWatch-Lite-$VERSION-arm64.dmg" \
            "windows-x86_64=dist/ThinkWatch-Lite-$VERSION-x64-setup.exe" \
            "windows-aarch64=dist/ThinkWatch-Lite-$VERSION-arm64-setup.exe" \
            "linux-x86_64-appimage=dist/ThinkWatch-Lite-$VERSION-x86_64.AppImage" \
            "linux-x86_64-deb=dist/thinkwatch-lite_${VERSION}_amd64.deb" \
            "linux-aarch64-appimage=dist/ThinkWatch-Lite-$VERSION-aarch64.AppImage" \
            "linux-aarch64-deb=dist/thinkwatch-lite_${VERSION}_arm64.deb"

      - uses: softprops/action-gh-release@v2
        with:
          # `.sig` 不挂：签名已经写进 latest.json，挂上去只是多几个让人
          # 不知道该下哪个的文件
          files: |
            dist/ThinkWatch-Lite-*-arm64.dmg
            dist/ThinkWatch-Lite-*-arm64.dmg.sha256
            dist/ThinkWatch-Lite-*-setup.exe
            dist/ThinkWatch-Lite-*-setup.exe.sha256
            dist/ThinkWatch-Lite-*.AppImage
            dist/ThinkWatch-Lite-*.AppImage.sha256
            dist/thinkwatch-lite_*.deb
            dist/thinkwatch-lite_*.deb.sha256
            dist/latest.json
          generate_release_notes: true

      # Homebrew 装的应用读的是 tap 里的 cask：**cask 没跟上之前，
      # `brew upgrade` 什么也装不到**，那部分用户就一直停在上一版。所以发布
      # 一完成就把 cask 推过去，而不是等 tap 每小时那一轮。
      #
      # 改 cask 的仍然是 tap 自己的脚本（`scripts/bump.sh`）：它照着刚发出去的
      # release 取文件、亲手算校验值，和定时跑的是同一段代码。
      #
      # **推不动也不让发版失败**：密钥没配、被撤销、tap 一时连不上，最多是晚
      # 一个小时 —— 那边的定时还在。
      - name: The tap follows this release
        if: env.TAP_DEPLOY_KEY != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/tap_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$TAP_DEPLOY_KEY" >"$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:ThinkWatchProject/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          bash scripts/bump.sh
          if git diff --quiet; then
            echo "cask 已经指着这一版了。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "thinkwatch-lite $VERSION"
          git push
