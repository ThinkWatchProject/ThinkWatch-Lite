# The gates every change has to pass.
#
# This is a Tauri app, so there are two toolchains: the frontend
# (typecheck + build) and the Rust shell (fmt + clippy + tests). Both
# run, because a green Rust side with a broken `tsc` is an app that
# won't start.
#
# No `.app` is built here. That is `release.yml`'s job, and it only runs on
# a tag — bundling on every push would add minutes to every PR to produce a
# file nobody downloads.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本号写在三个文件里，漂了之后谁也不报错 —— 直到打 tag 的那一
      # 刻，而那时候要收回一个已经推上去的 tag。在改它的那个 PR 上拦。
      - name: One version, three files
        run: bash scripts/version.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  rust:
    name: Rust
    # macOS, Windows and Linux each get their own job: every platform has
    # `cfg` branches (menu bar, notifications, theme, login-shell env) that
    # only its own compiler ever sees. This one also runs `cargo fmt`, once,
    # since formatting doesn't depend on the platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # **一个只检查代码的任务为什么要下载一个发布产物。**
      #
      # `tauri.conf.json` 声明 `.app` 里装着 twcore，而 Tauri 的
      # build script 在**编译期**就校验那个文件在不在 —— 所以连
      # `cargo clippy` 都需要它。
      #
      # 换个写法可以绕开（打包完再手工拷一份进去），代价是「没有网关
      # 的包」又能被悄悄造出来 —— 那正是引入这套东西要修的 bug。宁可
      # 让 CI 多下十四兆。校验和对得上就不会重复下载。
      - name: Fetch the core binary the bundle declares
        run: bash src-tauri/scripts/fetch-core.sh
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # Warnings are errors. Relaxing this on CI is the same as removing
      # it — a warning nobody is forced to read is a warning nobody
      # reads.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # **这台机器上没有 unix socket。**控制面在那里落在回环端口上，凭据是唯一的
  # 门，而在这个任务出现之前，那一半从来没有被编译过 —— 一个 `#[cfg(windows)]`
  # 分支「检查通过」和「根本没人看过它」长得一模一样。
  #
  # 不重复跑 `cargo fmt`：格式和平台无关，跑两遍只是慢一倍。
  #
  # **只编、只测，不打包。**安装包在 release.yml 里打；改了打包流程，推一个
  # `rehearse/` 开头的分支先演练。这个任务钉住的是「编得过、测得过、连得上」。
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # **失败也存。**这个 action 默认只在任务成功时保存缓存，而一个刚
          # 立起来、还在逐条修的任务恰恰一次都不会成功 —— 于是「红 → 不存
          # 缓存 → 从零编译 → 还是红」自己维持住了。
          cache-on-failure: true

      # 理由同 macOS 那一档：`tauri.conf.json` 声明包里装着 twcore，而 Tauri
      # 的 build script 在**编译期**就校验那个文件在不在。
      #
      # 取回来的是 Windows 那一份，名字带 `.exe` —— 见 `CORE_EXE`。
      - name: Fetch the core binary the bundle declares
        shell: bash
        run: bash src-tauri/scripts/fetch-core.sh

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 这里的测试**包含那条接缝测试**：起一份真的 twcore.exe，让桌面端这一侧
      # 的客户端在回环端口上真连上去。那条路在这个平台上没有替代品，而它是否
      # 成立，只有这台机器答得出来。
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # 理由同 Windows 那一档：一个 `#[cfg(target_os = "linux")]` 分支「检查通过」
  # 和「根本没人编过它」长得一模一样。跟随系统的深浅色（portal）、登录 shell
  # 的环境、系统通知，这些只在这里编、只在这里测。
  #
  # **ubuntu-22.04，不是 latest。**发出去的包在 22.04 上编（glibc 2.35 是支持
  # 的底线），检查也在同一个系统上做。
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 在 Debian/Ubuntu 上的系统依赖，照官方的前置清单
      # （https://v2.tauri.app/start/prerequisites/#linux）；`dbus` 给下面的
      # `dbus-run-session`
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # 理由同 macOS 那一档：`tauri.conf.json` 声明包里装着 twcore，而 Tauri
      # 的 build script 在**编译期**就校验那个文件在不在；接缝测试还要真的
      # 起它。
      #
      # **从钉住的那个 tag 现编，不下载。**core 的发版还没有 Linux 产物，
      # `fetch-core.sh` 没有这个平台可取。tag 的取法和它一样，编出来的就是
      # 那一版；等 core 发了 Linux 产物，这一步换回 `fetch-core.sh`。
      - name: Build the core binary the bundle declares
        run: |
          TAG=$(cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml \
            | python3 -c 'import json,re,sys
          for p in json.load(sys.stdin)["packages"]:
              if p["name"] == "tw-api":
                  print(re.search(r"[?&]tag=([^&#]+)", p["source"]).group(1))')
          cargo install --locked --git https://github.com/ThinkWatchProject/ThinkWatch-Core.git \
            --tag "$TAG" twcore --root "$RUNNER_TEMP/twcore"
          mkdir -p src-tauri/resources
          cp "$RUNNER_TEMP/twcore/bin/twcore" src-tauri/resources/twcore

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # **套一层会话总线。**这台机器没有桌面，而有几条测试要真的连 D-Bus
      # （系统通知的往返、深浅色的 portal）；不套的话通知那条会悄悄跳过自己。
      # `dbus-run-session` 起一个只活到命令结束的总线，把地址交给它
      - name: Test
        run: dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml
