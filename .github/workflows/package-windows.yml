# 打一个能装的 Windows 安装包。
#
# **手工触发，不发布。**这条流水线存在的理由是：第 2 期还有几件事只有在
# 一台真的 Windows 上装起来才验得了 —— 通知要 AUMID（而 AUMID 要开始菜单
# 快捷方式，也就是要装过）、界面在 WebView2 上长什么样、托盘左键右键、
# 主题和语言跟不跟得上系统。
#
# 这些都不是 CI 能回答的问题，CI 只能回答「编得过、测得过」。这里产出的是
# 一个人能下载、能双击的文件。
#
# **不挂在每个 PR 上**：它要把前端、Rust release 和 NSIS 全过一遍，比那个
# 检查任务慢得多，而它要回答的问题几天才变一次。
name: Package (Windows)

on:
  workflow_dispatch:

jobs:
  nsis:
    name: NSIS installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` 会取 twcore 并核对校验和，所以这里不用先取。
      - name: Build
        run: pnpm tauri build

      # **拆开看一眼再交出去。**一个缺了网关的包从文件大小上看不出任何问题
      # —— 它照样装、照样启动，然后停在连接页上。macOS 那边发版时做的是同
      # 一件事，理由也一样。
      - name: Look inside before handing it over
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "*-setup.exe" `
            -Path src-tauri\target\release\bundle | Select-Object -First 1
          if (-not $exe) { throw "没打出安装包" }
          Write-Host ("installer: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB))

          # 网关在不在。装进去的那一份叫 twcore.exe（见 `CORE_EXE`）
          $core = "src-tauri\target\release\twcore.exe"
          if (-not (Test-Path $core)) {
            $core = Get-ChildItem -Recurse -Filter "twcore.exe" -Path src-tauri\target\release |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $core) { throw "打出来的东西里没有 twcore.exe" }
          & $core --version

      - uses: actions/upload-artifact@v4
        with:
          name: thinkwatch-lite-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
